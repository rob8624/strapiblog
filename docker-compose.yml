version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: strapiblog-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 93739373
      POSTGRES_DB: strapiblog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: